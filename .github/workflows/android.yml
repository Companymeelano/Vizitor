name: Android

on:
  push:
    paths-ignore:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Sign release with the project keystore password
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/release.jks \
            -storepass g1z4-control-pro \
            -keypass g1z4-control-pro \
            -alias g1z4 \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=G1 Z4 Control Pro, O=Independent, C=IR"

      - name: Test and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: g1z4-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/**

      - name: Publish installable APKs
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/g1z4-control-pro-debug.apk
          cp app/build/outputs/apk/release/*.apk release/g1z4-control-pro-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/*.apk
          if git diff --cached --quiet; then
            echo "APKs unchanged"
          else
            git commit -m "Add debug and release APKs"
            git push
          fi
