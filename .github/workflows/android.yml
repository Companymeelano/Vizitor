name: Android

on:
  push:
    paths-ignore:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install compile SDK 35
        run: |
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Sign release with the project keystore password
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/release.jks \
            -storepass g1z4-control-pro \
            -keypass g1z4-control-pro \
            -alias g1z4 \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=G1 Z4 Control Pro, O=Independent, C=IR"

      - name: Test and assemble
        run: |
          chmod +x gradlew
          mkdir -p build-logs
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace > build-logs/gradle.txt 2>&1
          code=$?
          set -e
          python3 -c 'from pathlib import Path; p=Path("build-logs/gradle.txt"); t=p.read_text(errors="replace").splitlines() if p.exists() else ["missing gradle log"]; keys=("e: ","error:","FAILED","What went wrong","Execution failed","FAILURE:"); Path("build-logs/errors.txt").write_text("\n".join([l for l in t if any(k in l for k in keys)][-300:])); Path("build-logs/tail.txt").write_text("\n".join(t[-220:]))'
          exit "$code"

      - name: Publish the failure excerpt
        if: failure()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-logs/errors.txt build-logs/tail.txt
          git diff --cached --quiet && echo "no excerpt" && exit 1
          git commit -m "Record CI failure excerpt"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: g1z4-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/**

      - name: Publish installable APKs
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/g1z4-control-pro-debug.apk
          cp app/build/outputs/apk/release/*.apk release/g1z4-control-pro-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/*.apk
          if git diff --cached --quiet; then
            echo "APKs unchanged"
          else
            git commit -m "Add debug and release APKs"
            git push
          fi
