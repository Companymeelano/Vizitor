# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v2.4.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v2.4.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "آتیران ویزیتور — نسخه ۲٫۴٫۰ (گفتگو در منوی اصلی + ویترین تک‌ردیفه + آیکن و بنر لوکس)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v2.4.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه — «لوکس‌تر، واضح‌تر، مدیریتی‌تر»:
            - 💬 **گفتگو حالا تب اصلی منوی پایین است** (کنار پیشخوان و ویترین) با آیکن اختصاصی
            - 🔐 مدیریت گفتگو با نام‌کاربری/رمز مدیر (پیش‌فرض admin/admin — بدون هیچ راهنمای نمایشی) و امکان **تغییر رمز مدیر** پس از ورود
            - 🛍️ **ویترین تک‌ردیفه**: کارت‌های پهن با صحنه ۱۱۸dp، چیپ‌های کریستالی مشخصات (موجودی/واحد/بسته) — نمایش واضح‌تر مشخصات کالا
            - 👤 **کارت مشتری با بنر لوکس آجیل/خشکبار** که با پالت تم فعال تنت‌رنگی می‌گیرد
            - 🎯 **آیکن لانچر طلایی-مجلسی** تازه (کاسه آجیل سه‌بعدی) + آیکن تطبیقی Android
            - ✨ ارتقای لوکس (۷ پیشنهاد): هستیک+باریکه طلایی کششی روی دکمه‌های هیرو، تِخت امضای میلانو در پیشخوان، نام زنده تم در سوییچر، پارالاکس لمسی کارت‌ها، تایپوگرافی طلایی رشیده‌تر، پس‌زمینه ابریشم زنده
          files: dist/Vizitor-v2.4.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
