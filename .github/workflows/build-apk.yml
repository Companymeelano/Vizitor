# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v2.2.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v2.2.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "آتیران ویزیتور — نسخه ۲٫۲٫۰ (سطوح کریستالی، بکگراند ابریشم روان، دکمه‌های سه‌بعدی، نورهای مداری)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v2.2.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه — «هوشمند، فشرده، جریان کامل مشتری»:
            - 📊 **پیشخوان فشرده‌سازی شد**: همه چارت‌ها ادغام و کوچک شدند اما بدون حذف هیچ اطلاعاتی — دونات دوحلقه «نبض امروز» (تارگت بیرونی + سینک داخلی) + ۶ چیپ آمار + کارت «ریسک ⇄ فرصت» (بدهی‌ها و پرفروش‌ها کنار هم) + چارت هفتگی خلوت با ۳ چیپ هوشمند
            - 🎨 **سوییچر تم پنجتایی زنده** روی گوشه بالای پیشخوان — نقاط رنگی هر پالت با چک‌مارک و قاب طلایی؛ رنگ دکمه‌ها با تم انتخابی عوض می‌شود
            - ➕ **ثبت مشتری جدید** در بخش مشتری: فرم شیک (نام/تماس/شهر/گروه/آدرس)، ذخیره آفلاین با شناسه منفی متوالی و پرچم «در انتظار تأیید» + ارسال خودکار به سرور آتیران (action=submit_customer) برای تأیید توسط حسابداری
            - ⏳ کارت مشتری در انتظار تأیید: بنر طلایی، چیپ وضعیت، و غیرفعال‌بودن صدور فاکتور تا تأیید — پس از تأیید حسابداری فعال می‌شود
            - 🔍 **جستجوی مشتری در سبد سفارش**: انتخابگر زیبا با جستجوی زنده (نام/کد/شهر)، آواتار و «مشتری متفرقه»
          files: dist/Vizitor-v2.2.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
