# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v1.8.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v1.8.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: "آتیران ویزیتور — نسخه ۱٫۸٫۰ (پنج تم لاکچری: ۳ تیره + ۲ روشن، حذف پیشنهاد کالای مکمل)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v1.8.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه:
            - 🎨 **سیستم پنج‌تایه تم لاکچری** با انتخابگر زنده در «گزارشات و تنظیمات ← پوسته و تم»:
              - 🌙 شبِ سلطنتی (تیره — بنفش نئونی)
              - 🥇 شبِ طلایی (تیره — طلایی کازینویی لوکس)
              - 💚 زمردِ شب (تیره — سبز زمردی مخملی)
              - ☀️ مروارید سلطنتی (روشن — کرم عاج + بنفش سلطنتی)
              - 🌹 رزِ لاکچری (روشن — صورتی رزگلد)
            - 🌈 تمامی بخش‌ها (متن‌ها، دکمه‌ها، کارت‌ها، نمودارهای سه‌بعدی، جدول‌ها، نقشه، امضا و نوار پایین) از یک پالت معنایی واحد رنگ می‌گیرند — هماهنگی کامل رنگ در کل برنامه با هر تم
            - ⚡ تعویض تم به‌صورت زنده و بدون ری‌استارت + ذخیره ماندگار انتخاب کاربری + هماهنگی خودکار آیکن‌های نوار وضعیت با روشن/تیره بودن تم
            - 🗑️ حذف بخش «پیشنهاد کالای مکمل» (دستیار هوشمند فروش) از سبد سفارش طبق درخواست
          files: dist/Vizitor-v1.8.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
