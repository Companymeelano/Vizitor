# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v2.7.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v2.7.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.0
          name: "آتیران ویزیتور — نسخه ۲٫۷٫۰ (۶ نقش با کاراکترهای شغلی + چارت چک‌های پیگیری + پیشخوان دقیق‌تر)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v2.7.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه:
            - 🎬 اسپلش: حذف برچسب بالایی؛ تایپوگرافی کالیبره‌شده نام پخش (۲۴sp) و مدیریت (۱۳٫۵sp)؛ فوتر هوشمند با امضای میلانو/Milad Yaghoobi + نسخه — بدون برچسب‌های شلوغ
            - 🧑‍💼 **۶ کارت نقش** با کاراکترهای سه‌بعدی شغلی (هم‌سیاق شخصیت‌های آجیل مشتریان): مامور فروش•مدیریت•مدیر فروش•حسابداری•انبار و پخش•کاربر فروشگاه — ویزیتور فعال، بقیه «به‌زودی»
            - 📊 **چارت پیگیری چک‌های مشتریان**: سریال/بانک/مبلغ/روزهای مانده + نوار مهلت + دکمه تماس مستقیم و «ثبت شد» (خود تیک می‌خورد)
            - 💰 کارت بدهکاران تک‌ستونه (پرفروش‌ها حذف شد) + عنوان دقیق‌تر پیشخوان «مرکز فرماندهی ویزیت»
            - ⚖️ فاصله کاملاً مساوی منوهای پایین (تنگ‌کردن جایگاه FAB)
          files: dist/Vizitor-v2.7.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
