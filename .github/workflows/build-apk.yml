# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v2.6.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v2.6.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: "آتیران ویزیتور — نسخه ۲٫۶٫۰ (منوی پایین سه‌بعدی + اسپلش چند‌نقشه + آواتارهای انسانی)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v2.6.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه — «منوی سه‌بعدی + اسپلش چند‌نقشه»:
            - 🎛️ **منوی پایین بازطراحی‌شده**: هر تب کپسول سه‌بعدی گرادیانی از رنگ تم انتخابی با حلقه طلایی هنگام انتخاب، پرش فنری به بالا و برچسب Bold — پیشخوان/ویترین/گفتگو/مشتری/گزارشات (آیکن رسید) + سبد مرکزی شناور بدون متن
            - 🪟 پس‌زمینه نوار: گرادیان عمیق از پالت (برای تم‌های تیره مشکی مخملی، برای روشن‌ها عاج سه‌بعدی)
            - 🎬 **اسپلش چند‌نقشه جدید**: کارت اطلاعات برند شیشه‌ای + ۴ کارت نقش با آواتار انسانی (ویزیتور فعال؛ مدیریت/انبار و پخش/حسابداری با قفل «به‌زودی» + توست راهنما) — بدون نمایش منوی پایین در اسپلش
            - 👤 آواتارهای انسانی در گفتگو: انتخابگر آواتار در ثبت‌نام + مخزن ۹ آواتار (آجیل‌ها + چهره‌ها) برای سایر اعضا
          files: dist/Vizitor-v2.6.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
