# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v2.13.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v2.13.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.13.0
          name: "آتیران ویزیتور — نسخه ۲٫۱۳٫۰ (تب تنظیمات با نشان چرخ‌دنده سه‌بعدی + انتخاب تم)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v2.13.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه — «تب تنظیمات»:
            - ⚙️ **تب جدید «تنظیمات»** در نوار پایین با نشان سه‌بعدی چرخ‌دنده بنفش-طلایی هماهنگ با خانواده نشان‌ها — ترتیب ناوبری: پیشخوان، ویترین، گفتگو | سبد | مشتری، گزارشات، تنظیمات
            - 🎨 **انتخاب تم اپلیکیشن** به تنظیمات آمده: ۵ پالت (شبِ سلطنتی، نیمه‌شب طلایی، زمرد نوآر، مروارید سلطنتی، رز لوکس) با نمونه رنگ زنده و تیک/حلقه طلایی — تعویض آنی بدون ری‌استارت
            - 🧩 پیکربندی سرور + کارت وضعیت سلامت + مدیریت همگام‌سازی به تب تنظیمات منتقل شد؛ «گزارشات» حالا تمرکز خالص روی تاریخچه فاکتورها و درباره دارد
            - 🧿 **نشان‌های سه‌بعدی اختصاصی تب‌ها**: پیشخوان (تاج سلطنتی)، ویترین (گنبد شیشه‌ای پسته)، گفتگو (حباب گفتگو)، مشتری (مجسمه کاربر با حلقه طلایی)، گزارشات (نمودار با پیکان طلایی) — بدج گرد تیره، حلقه طلایی در حالت انتخاب، کم‌رنگ‌تر در حالت عادی؛ ابعاد ثابت و تراز دقیق هر ۵ تب
            - 🌰 **بنر «پخش عمده آجیل و خشکبار» خلوت شد**: عکس شلوغ قبلی جایگزین شد با نمای لوکس ابریشم تیره با استیلیف کوچک سمت راست و فضای خالی برای متن؛ تنتِ تم سبک‌تر شد و متن به ناحیه خلوت منتقل گردید
            - 🟦 **قاب دقیق دکمه‌های قهرمان**: «بهینه‌سازی مسیر ویزیت» و «افزودن مشتری جدید» با طراحی HeroActionButton دولاینی — عنوان و زیرعنوان داخل قاب، کپسول آیکن با فاصله ثابت از لبه‌ها، بردر دقیقاً روی مرز دکمه (بدون بیرون‌زدگی)، رنگ‌ها از پالت تم فعال
            - 🌰 **آیکون جدید اپ**: حرف M سه‌بعدی فلزی بنفش درهم‌آمیخته با پسته واقعی، روی پس‌زمینه دارک — ساخته‌شده در همه دانسیته‌ها + آیکون گرد/تطبیقی اندروید
            - 📐 **تراز کامل نوار ناوبری پایین**: حذف بالاپریدن تب انتخابی، ابعاد یکسان برای هر ۵ دکمه، نشانگر طلایی داخل قاب تب
            - 🟨 **رفع بردر زرد نامرتب**: دکمه‌های کارت مشتری همه ۵۶dp و هم‌تراز شدند؛ چیپ‌های «پیامک/مانده/گردش حساب» ارتفاع ثابت و بردر یکنواخت دورتا‌دور گرفتند
            - ➕➖ استپر کارت کالا: هر سه عنصر (کاهش/شمارنده/افزایش) دقیقاً ۳۶dp و هم‌تراز

            - ❤️‍🩹 **کارت «وضعیت سلامت سرور»** در منوی گزارشات: هر بخش اتصال (پاسخ سرور، کلید API، تأخیر شبکه، دیتابیس Meelano، نسخه PHP و وب‌سرویس) جداگانه تیک می‌خورد و شمارش رکورد جداول (کالاها/مشتریان/فاکتورها/سال مالی) گزارش می‌شود
            - 🔄 **بازگشت یک‌لمسی به پیش‌فرض سرور میلانو** + پیش‌نمایش زندهٔ آدرس کامل وب‌سرویس هنگام ویرایش تنظیمات
            - 📊 **نتیجهٔ ماندگار همگام‌سازی**: خلاصه ارسال/دریافت و لیست خطاها زیر دکمه «همگام‌سازی اکنون» باقی می‌ماند
            - 🛠️ **server/Setup-VizitorServer.ps1**: اسکریپت راه‌اندازی خودکار سرور ویندوز ۱۱ — چک و اصلاح مرحله‌به‌مرحله (IIS، PHP 8.3 + درایور SQLSRV، سایت پورت 8731، فایروال، TCP/IP و Mixed Mode در SQL Server، تست سرتاسری API) با تیک سبز برای هر بخش سالم
            - 📡 اکشن ping سرور حالا گزارش سلامت کامل (دیتابیس، PHP، جداول) برمی‌گرداند
          files: dist/Vizitor-v2.13.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
