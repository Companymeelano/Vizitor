# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v2.1.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v2.1.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "آتیران ویزیتور — نسخه ۲٫۱٫۰ (سطوح کریستالی، بکگراند ابریشم روان، دکمه‌های سه‌بعدی، نورهای مداری)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v2.1.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه — «روان مثل کره، لاکچری مثل همیشه»:
            - ⚡ **موتور گرافیک سازگار**: تشخیص خودکار قدرت گوشی (رم، هسته، کلاس حافظه، نسخه اندروید) و تنظیم هوشمند سطح جلوه‌ها — حذف کامل هنگ و کندی روی همه گوشی‌ها (اقتصادی تا پرچمدار)
            - 🛍️ **ویترین کاملاً جدید**: پنل قیمت‌های سه‌بعدی — سکه‌های «فروش ۱» و «فروش ۲» کنار هم + نوار قهرمان «قیمت مصرف‌کننده» با قاب طلایی + نشان موجودی رنگی و جزئیات یکدست کالا
            - 👤 **تب «گشت‌زنی» به «مشتری» تغییر نام داد** و نقشه ابتدای صفحه حذف شد
            - 💎 **کارت مشتری جدید**: آواتار تو‌حلقه با نقطه اعتبار، نشان طلایی ترتیب ویزیت، پنل اطلاعات (نشانی/تماس/آخرین خرید)، کپسول مانده حساب و اکشن‌های کوچک سه‌تایی (پیامک | مانده | گردش حساب)
            - 🧮 رجیستری جلوه‌ها: در حالت «سبک/متعادل» انیمیشن‌های دائمی آیتم‌های لیست (قاب نور، جاروب نور، چرخش لمسی) خودکار خاموش می‌شوند
            - 📊 حالت گرافیک در بخش «درباره ما» گزارشات نمایش داده می‌شود
          files: dist/Vizitor-v2.1.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
