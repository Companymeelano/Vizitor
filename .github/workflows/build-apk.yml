# ═══════════════════════════════════════════════════════════════════════════
#  Vizitor — آتیران ویزیتور | بیلد خودکار APK نهایی و انتشار ریلیز
#  Developed by Milano Technical Team, Milad Yaghoobi
# ═══════════════════════════════════════════════════════════════════════════
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/01a09f68-vizitor]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean & Build Debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # در صورت خطا، لاگ را برای عیب‌یابی داخل مخزن ثبت کن (بدون بازفعال‌سازی CI)
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git add -f build.log
            git commit -m "chore(ci): build log [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Companymeelano/Vizitor.git" \
              HEAD:arena/01a09f68-vizitor || true
            exit "$rc"
          fi

      - name: Prepare distributable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Vizitor-v1.7.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vizitor-APK
          path: dist/Vizitor-v1.7.0.apk

      - name: Publish GitHub Release with downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "آتیران ویزیتور — نسخه ۱٫۷٫۰ (بازطراحی کامل پیشخوان: تم سلطنتی یکدست، چارت‌های سه‌بعدی، انتقال بدهی مشتریان زیر تارگت)"
          body: |
            نسخه قابل نصب اپلیکیشن **آتیران ویزیتور** ویژه پخش آجیل و خشکبار.

            📲 برای نصب روی گوشی اندروید، فایل **Vizitor-v1.7.0.apk** را از بخش Assets پایین همین صفحه دانلود و نصب کنید.

            ✨ تغییرات این نسخه — بازطراحی کامل «پیشخوان من»:
            - 🎨 تم رنگی استاندارد و یکدست سلطنتی در تمامی بخش‌های پیشخوان (کارت‌های شیشه‌ای + قاب سلطنتی + سرتیتر گرادیانی یکسان)
            - 🥇 جدول سه‌بعدی «هشدار بدهی مشتریان» بلافاصله پس از «تارگت ویزیتور» قرار گرفت؛ نشان‌های رتبه طلایی/نقره‌ای/برنزی سه‌بعدی
            - 📊 اجزای سه‌بعدی هماهنگ با تم در همه بخش‌ها: دونات عمق‌دار تارگت (سبز نئونی)، دونات صف ارسال (طلایی)، چارت ستونی سه‌بعدی هفتگی، نوارهای پیشرفت عمق‌دار
            - 📈 بخش «پرفروش‌ترین‌ها» با جدول سلطنتی سه‌بعدی، نوار سهم و ردیف جمع
            - 📏 مقیاس یکسان: فاصله‌گذاری، پدینگ، تایپوگرافی و اندازه دکمه‌ها/نوشته‌ها در کل پیشخوان استاندارد شد
            - کارت‌های پیگیری مشتریان با نوار سه‌بعدی شدت افت خرید و قابلیت انتخاب با لمس
          files: dist/Vizitor-v1.7.0.apk
          target_commitish: arena/01a09f68-vizitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
